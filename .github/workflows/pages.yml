name: Landingpage veröffentlichen

# Baut den Ordner website/ und veröffentlicht ihn über GitHub Pages.
# Läuft bei Änderungen an website/ auf main sowie bei jedem veröffentlichten
# Release — Letzteres sorgt dafür, dass die Download-Links nach einer neuen
# Version aktuell sind, auch ohne eigene Änderung an der Website.
#
# Die Download-Links werden hier beim Bauen fest in index.html eingesetzt,
# nicht zur Laufzeit im Browser abgefragt (siehe docs/superpowers/specs/
# 2026-08-07-landingpage-design.md, Abschnitt "Hosting & Architektur").

on:
  push:
    branches: [main]
    paths: ["website/**"]
  release:
    types: [released]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: CI-Badge aktualisieren
        run: |
          # Das Badge liegt lokal (keine Drittanbieter-Anfrage beim Seitenaufruf,
          # siehe Datenschutzerklärung) und wird bei jedem Deploy aufgefrischt.
          # Schlägt der Abruf fehl, bleibt der eingecheckte Snapshot bestehen.
          curl -fsSL -o website/ci-badge.svg \
            "https://github.com/abnun/kleinunternehmer-verwaltung/actions/workflows/ci.yml/badge.svg" \
            || echo "Badge-Abruf fehlgeschlagen — eingecheckter Snapshot wird verwendet."

      - name: Neuestes Release abfragen
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          json=$(gh api repos/abnun/kleinunternehmer-verwaltung/releases/latest)
          version=$(echo "$json" | jq -r '.tag_name' | sed 's/^v//')
          dmg=$(echo "$json" | jq -r '.assets[] | select(.name | endswith(".dmg")) | .browser_download_url')
          exe=$(echo "$json" | jq -r '.assets[] | select(.name | endswith("-setup.exe")) | .browser_download_url')
          msi=$(echo "$json" | jq -r '.assets[] | select(.name | endswith(".msi")) | .browser_download_url')

          # Allowlist: Alles, was nicht exakt wie eine Version bzw. eine
          # Asset-URL dieses Repos aussieht, wird abgewiesen — statt es
          # ungeprüft in die veröffentlichte Seite zu schreiben. Ein Tag-Name
          # ist ein frei wählbarer Git-Ref und darf HTML-Metazeichen enthalten.
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.]+)?$'; then
            echo "Unerwartete Version: $version" >&2
            exit 1
          fi
          basis='https://github\.com/abnun/kleinunternehmer-verwaltung/releases/download'
          for u in "$dmg" "$exe"; do
            if [ -z "$u" ] || ! printf '%s' "$u" | grep -qE "^$basis/[0-9A-Za-z._%~+-]+/[0-9A-Za-z._%~+-]+$"; then
              echo "Fehlende oder unerwartete Asset-URL: '$u' — Release-Assets prüfen." >&2
              exit 1
            fi
          done

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "exe=$exe" >> "$GITHUB_OUTPUT"
          echo "msi=$msi" >> "$GITHUB_OUTPUT"

      - name: Download-Links in index.html einsetzen
        env:
          # Werte kommen ausschließlich über die Umgebung in das Skript —
          # nie als ${{ }}-Interpolation in den Skripttext. Zusätzlich
          # escapet html.escape() jeden Wert, bevor er ins HTML gelangt:
          # Die Allowlist oben ist die erste Verteidigungslinie, das
          # Escaping die zweite.
          VERSION: ${{ steps.release.outputs.version }}
          DMG_URL: ${{ steps.release.outputs.dmg }}
          EXE_URL: ${{ steps.release.outputs.exe }}
        run: |
          python3 - <<'PY'
          import html, os, pathlib
          pfad = pathlib.Path("website/index.html")
          text = pfad.read_text(encoding="utf-8")
          latest = "https://github.com/abnun/kleinunternehmer-verwaltung/releases/latest"
          ersetzungen = [
              ('<span id="release-version">siehe Releases</span>',
               '<span id="release-version">{}</span>'.format(html.escape(os.environ["VERSION"]))),
              ('<a id="download-primaer" class="download-primaer" href="{}">'.format(latest),
               '<a id="download-primaer" class="download-primaer" href="{}">'.format(html.escape(os.environ["DMG_URL"], quote=True))),
              ('<a id="download-sekundaer" class="download-nebenrangig" href="{}">'.format(latest),
               '<a id="download-sekundaer" class="download-nebenrangig" href="{}">'.format(html.escape(os.environ["EXE_URL"], quote=True))),
          ]
          for alt, neu in ersetzungen:
              if text.count(alt) != 1:
                  raise SystemExit("Platzhalter nicht genau einmal gefunden: " + alt)
              text = text.replace(alt, neu)
          pfad.write_text(text, encoding="utf-8")
          PY
          # Die MSI-URL (steps.release.outputs.msi) wird hier bewusst nicht
          # als eigener dritter Download-Button eingesetzt — die Seite hat
          # genau zwei Download-Links (siehe Task 1), die MSI-Variante
          # bleibt über die allgemeine Release-Seite erreichbar.

      - name: Pages einrichten
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: website/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Nach GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
