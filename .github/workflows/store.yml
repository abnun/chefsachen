name: Store

# Baut die Microsoft-Store-Fassung als MSIX und legt sie als Artefakt ab. Nur
# von Hand ausgelöst: Eine Einreichung ist eine bewusste Entscheidung, kein
# Nebenprodukt eines Tags.
#
# Hochgeladen wird das Paket von Hand im Partner Center. Es bleibt unsigniert,
# der Store signiert selbst.
#
# Die Angaben aus dem Partner Center (Produktidentität) stehen als
# Repository-Variablen unter Settings → Secrets and variables → Actions →
# Variables, nicht als Secrets: Sie sind nicht geheim, sie stehen ohnehin im
# veröffentlichten Paket.
#   MS_STORE_IDENTITAET, MS_STORE_HERAUSGEBER, MS_STORE_HERAUSGEBER_ANZEIGENAME
#
# Der Mac-App-Store-Bau läuft nicht hier, sondern lokal mit
# scripts/mac-app-store.sh: Zertifikate und Provisioning-Profil liegen beim
# Betreiber.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  microsoft-store:
    name: Microsoft Store (MSIX)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, Stand 2026-08

      - name: Node.js einrichten
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, Stand 2026-08
        with:
          node-version: 24
          cache: npm

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, Stand 2026-08

      - name: Rust-Build-Cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2, Stand 2026-08
        with:
          workspaces: "./src-tauri -> target"
          # Eigener Schlüssel: Die Store-Fassung baut mit anderen Features als
          # der Release-Workflow und soll dessen Cache nicht verdrängen.
          key: microsoft-store

      - name: Frontend-Abhängigkeiten installieren
        run: npm ci

      - name: MSIX bauen
        shell: pwsh
        env:
          MS_STORE_IDENTITAET: ${{ vars.MS_STORE_IDENTITAET }}
          MS_STORE_HERAUSGEBER: ${{ vars.MS_STORE_HERAUSGEBER }}
          MS_STORE_HERAUSGEBER_ANZEIGENAME: ${{ vars.MS_STORE_HERAUSGEBER_ANZEIGENAME }}
        run: ./scripts/microsoft-store.ps1

      - name: MSIX als Artefakt ablegen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Stand 2026-11
        with:
          name: chefsachen-microsoft-store
          path: src-tauri/target/microsoft-store/*.msix
          if-no-files-found: error
