name: Release

# Löst aus, sobald ein Tag wie "v0.1.0" gepusht wird:
#   git tag v0.1.0 && git push origin v0.1.0
# Baut unsignierte Installer für macOS (.dmg) und Windows (.msi/.exe) und
# hängt sie an einen neuen GitHub-Release-Entwurf an.
#
# Signing/Notarization ist bewusst nicht eingerichtet: Die App geht vorerst nur
# an Family & Friends, dafür lohnen sich Apple-Developer- und Windows-Zertifikat
# nicht. Nutzer bestätigen die Sicherheitswarnung beim ersten Start einmalig
# (siehe docs/installation-freunde.md). Sobald Zertifikate vorliegen, genügt es,
# die auskommentierten Secrets unten zu setzen — tauri-action nutzt sie dann
# automatisch, ohne dass dieser Workflow geändert werden muss.
#
# Der Auto-Updater ist davon unabhängig: Er prüft die Update-Pakete gegen ein
# eigenes minisign-Schlüsselpaar, nicht gegen ein Zertifikat der Plattform.
# Dafür muss das Secret TAURI_SIGNING_PRIVATE_KEY gesetzt sein — ohne es baut
# tauri-action zwar Installer, aber keine signierten Update-Artefakte und keine
# latest.json, und kein Bestandsnutzer erfährt je von der neuen Version.
#
# WICHTIG: Der Updater fragt
#   https://github.com/abnun/kleinunternehmer-verwaltung/releases/latest/download/latest.json
# ab. Diese Adresse zeigt nur auf *veröffentlichte* Releases. Der Workflow legt
# unten bewusst einen Entwurf an — er muss auf GitHub also noch veröffentlicht
# werden, sonst sieht niemand die Aktualisierung.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, Stand 2026-08

      - name: Node.js einrichten
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, Stand 2026-08
        with:
          node-version: 20

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, Stand 2026-08
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust-Build-Cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2, Stand 2026-08
        with:
          workspaces: "./src-tauri -> target"

      - name: Frontend-Abhängigkeiten installieren
        run: npm ci

      # Der Text landet als `notes` in der latest.json und ist genau das, was
      # der Aktualisierungsdialog dem Nutzer als „was ist neu" zeigt. Er muss
      # deshalb *vor* dem Bau feststehen — die Beschreibung des Releases auf
      # GitHub nachträglich zu ändern, ändert die latest.json nicht mehr.
      - name: Änderungstext aus dem CHANGELOG lesen
        id: notizen
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          text=$(awk -v v="## $version" '
            $0 == v { drin = 1; next }
            drin && /^## / { exit }
            drin { print }
          ' docs/CHANGELOG.md)
          if [ -z "$(echo "$text" | tr -d '[:space:]')" ]; then
            echo "Kein Abschnitt \"## $version\" in docs/CHANGELOG.md gefunden." >&2
            exit 1
          fi
          delim="CHANGELOG_ENDE_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "text<<$delim"
            echo "$text"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Tauri-App bauen und Release erstellen
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v0, Stand 2026-08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signatur der Update-Pakete (minisign, selbst erzeugt — kein Zertifikat).
          # Erzeugt mit: npm run tauri signer generate
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS-Signing (optional, sobald vorhanden):
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows-Signing (optional, sobald vorhanden):
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Chefsachen ${{ github.ref_name }}"
          releaseBody: ${{ steps.notizen.outputs.text }}
          includeUpdaterJson: true
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  pruefsummen:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: SHA256SUMS.txt erzeugen und anhängen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tag-Namen sind frei wählbare Git-Refs (siehe pages.yml, der
          # Injection-Punkt aus der Security-Prüfung) — deshalb hier über
          # env laufen lassen statt als ${{ }}-Interpolation in den
          # Skripttext, wo sie aus dem Shell-Kontext ausbrechen könnten.
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # Draft-Releases sind über releases/tags/<tag> nicht auffindbar —
          # deshalb über die Liste gehen und nach dem Tag filtern.
          release_id=$(gh api "repos/$REPO/releases" \
            --jq '.[] | select(.tag_name == $ENV.TAG) | .id' | head -1)
          if [ -z "$release_id" ]; then
            echo "Kein Release für Tag $TAG gefunden." >&2
            exit 1
          fi
          mkdir assets && cd assets
          gh api "repos/$REPO/releases/$release_id/assets" \
            --jq '.[] | [.name, .url] | @tsv' | while IFS=$'\t' read -r name url; do
            case "$name" in
              SHA256SUMS.txt) continue ;;
            esac
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o "$name" "$url"
          done
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh api -X POST "https://uploads.github.com/repos/$REPO/releases/$release_id/assets?name=SHA256SUMS.txt" \
            -H "Content-Type: text/plain" --input SHA256SUMS.txt
