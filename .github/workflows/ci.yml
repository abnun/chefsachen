name: CI

# Prüft jeden Push und jeden Pull Request. Bis hierhin gab es nur den
# Release-Workflow, der ausschließlich auf Tags lief und keine Tests ausführte —
# kein Commit wurde je maschinell geprüft.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Typen und Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typprüfung
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Tests
        run: npm test

  backend:
    name: Backend (Clippy und Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # KoSIT-Validator und veraPDF sind Java-Werkzeuge. Ohne JVM überspringen
      # sich die Normprüfungen — hier sind sie Pflicht, siehe KOSIT_PFLICHT.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Systembibliotheken für den Tauri-Bau unter Linux.
      - name: Systemabhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      # Prüfwerkzeuge und Regelwerke liegen bewusst nicht im Repository
      # (rund 50 MB Fremdartefakte). Der Cache spart den Download bei jedem Lauf.
      - name: Prüfwerkzeuge zwischenspeichern
        uses: actions/cache@v4
        with:
          path: src-tauri/.validator-cache
          key: pruefer-kosit1.6.2-xr3.0.2-2026-01-31-verapdf1.30.2

      - name: Prüfwerkzeuge bereitstellen
        run: ./scripts/kosit-vorbereiten.sh

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        # KOSIT_PFLICHT lässt die Normprüfungen (XRechnung und PDF/A)
        # fehlschlagen, statt sich zu überspringen, falls ein Prüfer oder die
        # JVM fehlt. Ohne diesen Schalter
        # wäre ein bestandener Lauf nicht von einem übersprungenen zu
        # unterscheiden — wir hielten uns für validiert, ohne es zu sein.
        env:
          KOSIT_PFLICHT: "1"
        run: cargo test --manifest-path src-tauri/Cargo.toml

  e2e:
    name: Durchstich (WebDriver)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: e2e

      # webkit2gtk-driver ist der WebDriver zu der Webview, die Tauri unter
      # Linux nutzt. tauri-driver spricht mit ihm; auf macOS gibt es dafür kein
      # Gegenstück, deshalb läuft dieser Job nur hier.
      - name: Systemabhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev webkit2gtk-driver xvfb

      - name: tauri-driver
        run: cargo install tauri-driver --locked

      - name: Durchstich
        # Auf dem Runner ist genug Speicher für parallele Übersetzung; die
        # Sparsamkeit aus lauf.sh gilt nur dem lokalen Container.
        env:
          # Der Runner hat vier Kerne und reichlich Speicher; die Sparsamkeit
          # aus lauf.sh gilt nur dem kleinen lokalen Container.
          CARGO_BUILD_JOBS: "4"
        run: ./e2e/lauf.sh
