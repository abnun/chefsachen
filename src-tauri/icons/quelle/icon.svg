<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Chefsachen – App-Icon
    macOS-Raster: Leinwand 1024, Fläche 824 (100 px transparenter Rand),
    kontinuierliche Ecken (r ≈ 185), Schatten nach unten innerhalb des Rands.
    Motiv: ein Beleg, leicht gedreht, zwei Zeilen und ein Haken in
    Kopierstift-Violett oklch(0.48 0.15 290) = #5f49ab.
  -->
  <defs>
    <linearGradient id="flaeche" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b55b9"/>
      <stop offset="1" stop-color="#533d9e"/>
    </linearGradient>
    <linearGradient id="papier" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f4f0"/>
    </linearGradient>
    <filter id="schatten" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.30"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blattschatten" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.16  0 0 0 0 0.09  0 0 0 0 0.36  0 0 0 0.45 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Grundfläche -->
  <path filter="url(#schatten)" fill="url(#flaeche)" d="M382.8 100 H641.2 C722.6 100 763.3 100 807.2 113.9 C855 135 889 169 910.1 216.8 C924 260.7 924 301.4 924 382.8 V641.2 C924 722.6 924 763.3 910.1 807.2 C889 855 855 889 807.2 910.1 C763.3 924 722.6 924 641.2 924 H382.8 C301.4 924 260.7 924 216.8 910.1 C169 889 135 855 113.9 807.2 C100 763.3 100 722.6 100 641.2 V382.8 C100 301.4 100 260.7 113.9 216.8 C135 169 169 135 216.8 113.9 C260.7 100 301.4 100 382.8 100 Z"/>

  <!-- Beleg: 420 × 540, um die Mitte leicht gegen den Uhrzeigersinn gedreht -->
  <g transform="rotate(-6 512 512)">
    <g filter="url(#blattschatten)">
      <!-- Blatt mit umgeknickter Ecke oben rechts -->
      <path fill="url(#papier)" d="M326 242 H630 L722 334 V760 Q722 782 700 782 H324 Q302 782 302 760 V264 Q302 242 324 242 Z"/>
      <path fill="#e2dfec" d="M630 242 V316 Q630 334 648 334 H722 Z"/>
    </g>
    <!-- zwei Zeilen -->
    <rect x="360" y="336" width="200" height="30" rx="15" fill="#b1a9ca"/>
    <rect x="360" y="414" width="300" height="30" rx="15" fill="#b1a9ca"/>
    <!-- Haken mit Kopierstift, leicht handschriftlich -->
