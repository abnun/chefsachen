[package]
name = "chefsachen"
version = "1.4.2"
description = "Rechnungen, Angebote und E-Rechnungen für Kleinunternehmer und Regelbesteuerte"
authors = ["Markus Müller <abnun@gmx.de>"]
license = "MIT"
readme = "../README.md"
publish = false
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chefsachen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
typst = "0.13"
typst-pdf = "0.13"
# Für die Vorschau der Belegvorlage. SVG statt PDF, weil die
# Inhaltsrichtlinie eingebettete PDFs verbietet (object-src 'none') und ein
# Bild über eine data:-URL ohne Aufweichung der Richtlinie auskommt.
typst-svg = "0.13"
typst-as-lib = "0.14"
lopdf = "0.46"
xmp-writer = "0.3"
quick-xml = { version = "0.42", features = ["serialize"] }
tauri-plugin-log = "2.9.0"
log = "0.4.33"
# Bündelt eine Sicherung mit dem Belegarchiv zu einer einzigen Datei beim
# Exportieren (P/A1). Reine Rust-Implementierung, kein Systemwerkzeug nötig.
zip = { version = "9", default-features = false, features = ["deflate"] }
# Für den optionalen SEPA-Girocode auf Rechnungen. Ohne image/svg-Feature —
# nur die Modul-Matrix wird gebraucht, Typst zeichnet sie als Vektor-Rechtecke.
qrcode = { version = "0.14", default-features = false }
tauri-plugin-window-state = "2.4.1"
# Für die optionalen Straßenvorschläge (Photon von komoot), nur nach
# Einwilligung in den Einstellungen. Ohne Standard-Features, damit weder
# OpenSSL noch ein zweiter Krypto-Anbieter (aws-lc) ins Programm kommt:
# rustls mit ring, wie ihn der Updater ohnehin mitbringt. In den
# Store-Fassungen fehlt der Updater, deshalb steht rustls hier selbst.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Baut die Anfrage-URL mit sauber kodierten Parametern.
url = "2"

[dev-dependencies]
# "test" liefert mock_builder/get_ipc_response — damit lassen sich Befehle über
# dieselbe Grenze aufrufen, die auch die Oberfläche benutzt.
tauri = { version = "2", features = ["test"] }
pdf-extract = "0.12.0"
tempfile = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Optional, weil die Store-Fassungen keinen Selbstaktualisierungscode enthalten
# dürfen (App-Store-Richtlinie 2.4.5): Updates kommen dort nur über den Store.
# Fehlt das Crate ganz, kann auch kein vergessener Aufruf mehr hineinrutschen.
tauri-plugin-updater = { version = "2.10.1", optional = true }

# Der Vertriebsweg wird beim Übersetzen festgelegt, nicht zur Laufzeit erkannt:
# Nur so fehlt der Updater im Store-Bau wirklich, statt bloß abgeschaltet zu sein.
#
#   GitHub (Standard):  cargo build
#   Mac App Store:      cargo build --no-default-features --features mac-app-store
#   Microsoft Store:    cargo build --no-default-features --features microsoft-store
#
# Die Store-Bauten brauchen zusätzlich ihre Konfigurationsüberlagerung
# (tauri.appstore.conf.json bzw. tauri.microsoftstore.conf.json), weil die
# Updater-Berechtigungen in tauri.conf.json sonst auf ein fehlendes Plugin
# zeigen. `tauri build --config <datei>` reicht sie selbst hinein; für reines
# cargo build/test/clippy übernimmt das die Umgebungsvariable TAURI_CONFIG:
#
#   TAURI_CONFIG="$(cat tauri.appstore.conf.json)" cargo test \
#     --no-default-features --features mac-app-store
[features]
default = ["selbst-aktualisierung"]
selbst-aktualisierung = ["dep:tauri-plugin-updater"]
mac-app-store = []
microsoft-store = []

