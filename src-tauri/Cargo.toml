[package]
name = "kleinunternehmer-verwaltung"
version = "0.2.4"
description = "Rechnungen, Angebote und E-Rechnungen für Kleinunternehmer nach § 19 UStG"
authors = ["Markus Müller <abnun@gmx.de>"]
license = "MIT"
readme = "../README.md"
publish = false
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kleinunternehmer_verwaltung_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
typst = "0.13"
typst-pdf = "0.13"
# Für die Vorschau der Belegvorlage. SVG statt PDF, weil die
# Inhaltsrichtlinie eingebettete PDFs verbietet (object-src 'none') und ein
# Bild über eine data:-URL ohne Aufweichung der Richtlinie auskommt.
typst-svg = "0.13"
typst-as-lib = "0.14"
lopdf = "0.35"
xmp-writer = "0.3"
quick-xml = { version = "0.37", features = ["serialize"] }
tauri-plugin-log = "2.9.0"
log = "0.4.33"

[dev-dependencies]
# "test" liefert mock_builder/get_ipc_response — damit lassen sich Befehle über
# dieselbe Grenze aufrufen, die auch die Oberfläche benutzt.
tauri = { version = "2", features = ["test"] }
pdf-extract = "0.12.0"
tempfile = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"

